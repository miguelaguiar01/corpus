name: release

# A tag v<version> publishes @corpus-tool/cli at that version. The first
# version was published by hand (trusted publishing is configured on the
# package's npm settings page, so the package has to exist first); every
# later tag goes through here with npm's automatic provenance, and a tag
# whose version is already on the registry only creates the release. A
# prerelease version (v0.2.0-next.1) publishes under the dist-tag next.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url here: with it, setup-node writes an .npmrc whose
      # empty auth token stops npm from doing the OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The npm this workflow was checked with (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.13.0 && npm --version
      - run: npm ci
      - name: The tag names the package version
        run: bin/release-check "${GITHUB_REF_NAME}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: The packed CLI round-trips a fresh repository
        run: bin/install-smoke
      # A version already on the registry is not published again: the
      # first one went up by hand, and a rerun of a tag must not fail
      # at publish and lose the GitHub release.
      - name: Publish
        working-directory: packages/cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@corpus-tool/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@corpus-tool/cli@${VERSION} is already on the registry; not publishing again"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
      - name: GitHub release with this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/changelog-section "${GITHUB_REF_NAME#v}" > /tmp/notes.md
          case "${GITHUB_REF_NAME}" in
            *-*) gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md --prerelease ;;
            *)   gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md ;;
          esac
