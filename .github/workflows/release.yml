name: release

# A tag v<version> publishes @corpus-tool/cli and @corpus-tool/workbench
# at that version and pushes the container image to the GitHub registry
# as :<version> (and :latest for a release). A package's first version is
# published by hand (trusted publishing is configured on the package's
# npm settings page, so the package has to exist first); every later tag
# goes through here with npm's automatic provenance, and a version
# already on the registry is skipped. A prerelease version
# (v0.4.0-next.1) publishes under the dist-tag next and tags the image
# with the prerelease version only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url here: with it, setup-node writes an .npmrc whose
      # empty auth token stops npm from doing the OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The npm this workflow was checked with (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.13.0 && npm --version
      - run: npm ci
      - name: The tag names the package version
        run: bin/release-check "${GITHUB_REF_NAME}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: The packed CLI round-trips a fresh repository
        run: bin/install-smoke
      # A version already on the registry is not published again: the
      # first one went up by hand, and a rerun of a tag must not fail
      # at publish and lose the image push or the GitHub release.
      - name: Publish both packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/cli packages/workbench; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already on the registry; not publishing again"
              continue
            fi
            case "${GITHUB_REF_NAME}" in
              *-*) (cd "$dir" && npm publish --access public --tag next) ;;
              *)   (cd "$dir" && npm publish --access public) ;;
            esac
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The container image, at this version
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/corpus"
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:$VERSION" --build-arg "CORPUS_VERSION=${GITHUB_REF_NAME}" .
          docker push "$IMAGE:$VERSION"
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest" ;;
          esac
      - name: GitHub release with this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/changelog-section "${GITHUB_REF_NAME#v}" > /tmp/notes.md
          case "${GITHUB_REF_NAME}" in
            *-*) gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md --prerelease ;;
            *)   gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md ;;
          esac
